name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches the toolchain the official plugin registry pins in its own CI.
  RUST_TOOLCHAIN: 1.96.1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt, clippy, test, wasm build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          for manifest in plugins/*/Cargo.toml; do
            echo "::group::fmt ${manifest}"
            cargo fmt --manifest-path "$manifest" --all -- --check
            echo "::endgroup::"
          done

      # The same entry point the README hands a reviewer. It runs every host
      # test and fails the job on any failing test, and it also fails if the
      # refusal filter or the golden enumeration comes back empty, so the three
      # figures the README advertises cannot rot unnoticed. The wasm half is
      # skipped here; the build step below covers it. Note that the plugin set
      # comes from an array inside the script, so a fourth plugin has to be
      # added there as well as landing in plugins/.
      - name: Host tests via the reviewer entry point
        shell: bash
        run: bash demo/run-demo.sh --no-wasm

      - name: Clippy on the host target
        shell: bash
        run: |
          set -euo pipefail
          for manifest in plugins/*/Cargo.toml; do
            echo "::group::clippy host ${manifest}"
            cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
            echo "::endgroup::"
          done

      - name: Clippy on wasm32-wasip2
        shell: bash
        run: |
          set -euo pipefail
          for manifest in plugins/*/Cargo.toml; do
            echo "::group::clippy wasm ${manifest}"
            cargo clippy --locked --manifest-path "$manifest" \
              --target wasm32-wasip2 --all-targets -- -D warnings
            echo "::endgroup::"
          done

      - name: Release component build
        shell: bash
        run: |
          set -euo pipefail
          for manifest in plugins/*/Cargo.toml; do
            plugin_dir="${manifest%/Cargo.toml}"
            echo "::group::build ${plugin_dir}"
            cargo build --locked --manifest-path "$manifest" \
              --target wasm32-wasip2 --release
            echo "::endgroup::"
          done
          echo "Built components:"
          find plugins -path '*/wasm32-wasip2/release/*.wasm' -printf '%p  %s bytes\n'

      - name: Manifest and wasm name agree
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for manifest in plugins/*/manifest.toml; do
            plugin_dir="$(dirname "$manifest")"
            declared="$(grep -E '^wasm_path' "$manifest" | cut -d'"' -f2)"
            built="${plugin_dir}/target/wasm32-wasip2/release/${declared}"
            if [[ -f "$built" ]]; then
              echo "ok: ${plugin_dir} declares ${declared}, and it was built"
            else
              echo "MISMATCH: ${plugin_dir} declares ${declared}, which was not built"
              status=1
            fi
          done
          exit "$status"
