[sop]
name = "stake-deactivation-review"
description = "Decide whether a stake account should be deactivated, then build the unsigned transaction. Pauses for operator approval before any bytes exist."
version = "1.0.0"
priority = "normal"
execution_mode = "supervised"
cooldown_secs = 0
max_concurrent = 1
agent = "sentinel"

# Agent-initiated. The operator asks in the channel and the agent fires this
# with sop_execute. The cron trigger type exists in the schema but no live
# scheduler feeds the SOP dispatcher in this version, so the daily brief runs
# as a top-level [cron.morning-brief] job instead of as a triggered SOP.
[[triggers]]
type = "manual"
