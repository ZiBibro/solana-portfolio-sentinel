[sop]
name = "stake-deactivation-review"
description = "Decide whether a stake account should be deactivated, then build the unsigned transaction. Pauses for operator approval before any bytes exist."
version = "1.0.0"
priority = "normal"
execution_mode = "supervised"
cooldown_secs = 0
max_concurrent = 1
agent = "sentinel"

# Manual. Start a run through the host's HTTP gateway: POST /pair, then
# POST /api/sops/stake-deactivation-review/run. Asking the agent in the channel
# did not work on the pinned host and is not the documented path; see
# shared/README.md and REPRODUCE.md section 7.4. The daily brief is a top-level
# [cron.morning-brief] job rather than a cron-triggered SOP.
[[triggers]]
type = "manual"
