[sop]
name = "stake-deactivation-review"
description = "Decide whether a stake account should be deactivated, then build the unsigned transaction. Every step waits for operator approval, including the build."
version = "1.0.0"
priority = "normal"
# step_by_step, not supervised. Under `supervised` the engine gates step 1 and
# nothing else (`execution_mode_needs_approval` returns `step.number == 1`).
# Step 3 held anyway, because `step_requires_approval_gate` returns true on
# `requires_confirmation` before it looks at the mode at all, so the readings
# were always seen before a build. What supervised left open is the build
# itself: once the checkpoint was cleared, step 4 called `stake_tx_build` with
# no gate of its own. This mode closes that, at the cost of one approval per
# step.
execution_mode = "step_by_step"
cooldown_secs = 0
max_concurrent = 1
agent = "sentinel"

# Manual. Start a run through the host's HTTP gateway: POST /pair, then
# POST /api/sops/stake-deactivation-review/run. Asking the agent in the channel
# did not work on the pinned host and is not the documented path; see
# shared/README.md and REPRODUCE.md section 7.4. The daily brief is a top-level
# [cron.morning-brief] job rather than a cron-triggered SOP.
[[triggers]]
type = "manual"
